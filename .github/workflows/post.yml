name: フォーエバー Threads自動投稿

on:
  schedule:
    - cron: '0 3 * * *'    # 毎日 12:00 JST（昼）
    - cron: '0 12 * * *'   # 毎日 21:00 JST（夜。日曜は長文の連投枠）
  workflow_dispatch:        # 手動実行も可能

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout threads-auto-post (スクリプト取得)
        uses: actions/checkout@v4

      - name: Checkout メインリポジトリ (投稿ストック)
        uses: actions/checkout@v4
        with:
          repository: ayakairo/ayaka
          token: ${{ secrets.MAIN_REPO_TOKEN }}
          path: ayaka-main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          POSTS_FILE: ${{ github.workspace }}/ayaka-main/in_フォーエバー/Threads/投稿ストック.md
        run: python post.py

      - name: メインリポジトリに投稿済み状態をコミット
        if: always()
        run: |
          cd ayaka-main
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "in_フォーエバー/Threads/投稿ストック.md"
          git diff --staged --quiet || git commit -m "auto: フォーエバーThreads投稿済みを更新 [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            git push && break
            echo "push failed (attempt $i), retrying after rebase..."
            sleep $((RANDOM % 5 + 1))
          done
